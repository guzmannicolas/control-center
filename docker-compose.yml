name: control-center

# Rotate container logs so they cannot slowly fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: runtime
  image: control-center-app
  env_file: .env
  restart: unless-stopped
  mem_limit: 256m
  logging: *logging
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: control
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Applies pending migrations once, then exits. The API and worker start only if it succeeds.
  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: build
    image: control-center-migrate
    env_file: .env
    command: ["pnpm", "--filter", "@cc/api", "exec", "prisma", "migrate", "deploy"]
    restart: "no"
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:4100:4100" # only reachable from the VPS itself
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    stop_grace_period: 40s # running checks get up to 30 s to finish

  # Node toolbox for development on a machine without Node: docker compose run --rm tools <cmd>
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    env_file: .env
    environment:
      HOME: /tmp
      COREPACK_HOME: /app/.cache/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /app/.cache/pnpm-store
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:4101:4100" # 4100 belongs to the running API
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
